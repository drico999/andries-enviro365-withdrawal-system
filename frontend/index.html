<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviro365 Investments — Withdrawal Notices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead__mark">Enviro365 Investments</div>
  <nav class="masthead__investors" id="investorTabs" aria-label="Select investor"></nav>
</header>

<main class="ledger" id="ledgerRoot">

  <!-- Stub: the "ticket" panel -->
  <section class="stub" aria-labelledby="totalBalance">
    <div class="stub__top">
      <p class="stub__eyebrow">Portfolio total</p>
      <h1 id="totalBalance" class="stub__total">—</h1>
      <p class="stub__investor" id="investorLine">Loading investor…</p>
    </div>

    <div class="stub__perforation" aria-hidden="true"></div>

    <div class="stub__bottom">
      <button class="btn btn--primary" id="openFormBtn" type="button">Request a withdrawal</button>

      <form class="withdraw-form" id="withdrawForm" hidden>
        <label class="field">
          <span>Product</span>
          <select id="productSelect" name="productId" required></select>
        </label>

        <label class="field">
          <span>Amount (ZAR)</span>
          <input type="number" id="amountInput" name="amount" min="0.01" step="0.01" placeholder="0.00" required>
        </label>

        <p class="field__hint" id="limitHint"></p>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary">Submit notice</button>
          <button type="button" class="btn btn--ghost" id="cancelFormBtn">Cancel</button>
        </div>
      </form>
    </div>
  </section>

  <!-- Holdings -->
  <section class="holdings" aria-labelledby="holdingsHeading">
    <h2 id="holdingsHeading">Holdings</h2>
    <table class="ledger-table" id="holdingsTable">
      <thead>
        <tr>
          <th scope="col">Product</th>
          <th scope="col">Type</th>
          <th scope="col" class="num">Balance</th>
          <th scope="col" class="num">Withdrawable (90%)</th>
        </tr>
      </thead>
      <tbody id="holdingsBody"></tbody>
    </table>

    <div class="history-head">
      <h2>Notice history</h2>
      <div class="history-filters">
        <select id="filterProduct" aria-label="Filter by product">
          <option value="">All products</option>
        </select>
        <input type="date" id="filterFrom" aria-label="From date">
        <input type="date" id="filterTo" aria-label="To date">
        <button class="btn btn--outline" id="exportBtn" type="button">Download CSV statement</button>
      </div>
    </div>

    <table class="ledger-table ledger-table--mono" id="historyTable">
      <thead>
        <tr>
          <th scope="col">Date</th>
          <th scope="col">Product</th>
          <th scope="col" class="num">Amount</th>
          <th scope="col" class="num">Balance after</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr class="empty-row"><td colspan="5">No withdrawal notices yet.</td></tr>
      </tbody>
    </table>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
